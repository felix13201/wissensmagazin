<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ein persönliches Wissensmagazin mit täglich neuen Perspektiven"><title>Wissensmagazin</title><style>:root{color-scheme:light;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#243043;background:#f8f7f3}*{box-sizing:border-box}body{margin:0}header{background:#162239;color:white;padding:24px max(22px,calc((100vw - 1050px)/2))}header h1{font-family:Georgia,serif;font-size:2.1rem;margin:5px 0}header p{opacity:.75;margin:0}.wrap{max-width:1050px;margin:36px auto;padding:0 22px}h2,h3{font-family:Georgia,serif}button,input{font:inherit}input{width:100%;border:1px solid #ccd0d5;border-radius:10px;padding:13px;background:white}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 24px}.filters button{background:white;border:1px solid #ccd0d5;border-radius:999px;padding:8px 14px;cursor:pointer}.filters button.active{background:#162239;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:white;border:1px solid #e3e3e1;border-radius:15px;padding:24px;cursor:pointer;text-align:left;min-height:225px}.card:hover{box-shadow:0 10px 30px #00000012}.muted{color:#687386;font-size:.88rem}.card h3{font-size:1.4rem;margin:13px 0}.reader{background:white;border:1px solid #e3e3e1;border-radius:16px;padding:clamp(22px,5vw,64px);max-width:800px;margin:auto}.reader h1{font-family:Georgia,serif;font-size:clamp(2rem,5vw,3.3rem);line-height:1.15}.prose{font-family:Georgia,serif;font-size:1.16rem;line-height:1.85}.prose h2{margin-top:2rem;line-height:1.3}.back{border:0;background:none;color:#285b9c;cursor:pointer;padding:0 0 20px}footer{text-align:center;color:#748092;padding:45px 12px;font-size:.85rem}.hidden{display:none}.notice{border-left:3px solid #c69b4c;padding:12px 16px;background:#fff9e9;margin:20px 0}a{color:#285b9c}</style></head><body><header><small>DEIN PERSÖNLICHES WISSENSMAGAZIN</small><h1>Jeden Tag eine neue Perspektive.</h1><p>Wissenschaft · Geschichte · Medizin · Sprache · Gesellschaft</p></header><main class="wrap"><section id="home"><h2>Alle Ausgaben</h2><p class="muted">Entdecken, suchen und weiterlesen.</p><input id="search" aria-label="Artikel suchen" placeholder="Artikel und Themen durchsuchen …"><div id="filters" class="filters"></div><div id="cards" class="cards"></div></section><section id="article" class="hidden"><article class="reader"><button class="back" id="back">← Zum Archiv</button><div id="articleContent"></div></article></section></main><footer>Wissensmagazin · Ein persönliches Leseprojekt · Stand November 2026</footer><script>let articles=[],category='Alle';const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function renderText(s){return s.split(/\n\s*\n/).map(p=>{if(p.startsWith('## '))return '<h2>'+esc(p.slice(3))+'</h2>';return '<p>'+esc(p).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')+'</p>'}).join('')}function archive(){let cats=['Alle',...new Set(articles.map(a=>a.category))];$('filters').innerHTML=cats.map(c=>'<button class="'+(c===category?'active':'')+'" data-category="'+esc(c)+'">'+esc(c)+'</button>').join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;archive()});let q=$('search').value.toLocaleLowerCase('de');let filtered=articles.filter(a=>(category==='Alle'||a.category===category)&&(a.title+' '+a.subtitle+' '+a.category).toLocaleLowerCase('de').includes(q));$('cards').innerHTML=filtered.map(a=>'<button class="card" data-id="'+esc(a.id)+'"><span class="muted">'+esc(a.date)+' · '+esc(a.category)+'</span><h3>'+esc(a.title)+'</h3><p>'+esc(a.subtitle)+'</p><span class="muted">Artikel öffnen →</span></button>').join('')||'<p>Keine passenden Artikel gefunden.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>location.hash=encodeURIComponent(b.dataset.id))}function route(){let id=decodeURIComponent(location.hash.slice(1)),a=articles.find(x=>x.id===id);$('home').classList.toggle('hidden',!!a);$('article').classList.toggle('hidden',!a);if(a){$('articleContent').innerHTML='<div class="muted">'+esc(a.date)+' · '+esc(a.category)+'</div><h1>'+esc(a.title)+'</h1><p>'+esc(a.subtitle)+'</p><div class="notice">Archivfassung: Die vollständigen Originaltexte werden noch ergänzt.</div><div class="prose">'+renderText(a.content)+'</div>';window.scrollTo(0,0)}else archive()}$('search').addEventListener('input',archive);$('back').onclick=()=>location.hash='';window.addEventListener('hashchange',route);fetch('./articles.json').then(r=>{if(!r.ok)throw Error('Laden fehlgeschlagen');return r.json()}).then(data=>{articles=data.sort((a,b)=>b.date.localeCompare(a.date));route()}).catch(()=>{$('cards').innerHTML='<p>Das Artikelarchiv konnte nicht geladen werden.</p>'});</script></body></html>
